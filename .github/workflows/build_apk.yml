              const emeraldGreen = Color(0xFF10B981);
              const goldAccent = Color(0xFFF59E0B);
              const alertRed = Color(0xFFEF4444);

              return MaterialApp(
                title: 'الدولي لقطع غيار الموتسيكلات - AL DAWLY POS',
                debugShowCheckedModeBanner: false,
                locale: const Locale('ar', 'EG'),
                supportedLocales: const [Locale('ar', 'EG')],
                localizationsDelegates: const [
                  GlobalMaterialLocalizations.delegate,
                  GlobalWidgetsLocalizations.delegate,
                  GlobalCupertinoLocalizations.delegate,
                ],
                themeMode: _themeMode,
                darkTheme: ThemeData(
                  brightness: Brightness.dark,
                  scaffoldBackgroundColor: darkNavyBg,
                  primaryColor: emeraldGreen,
                  colorScheme: const ColorScheme.dark(
                    primary: emeraldGreen,
                    secondary: goldAccent,
                    surface: darkCardBg,
                    error: alertRed,
                  ),
                  appBarTheme: const AppBarTheme(
                    backgroundColor: darkCardBg,
                    foregroundColor: Colors.white,
                    elevation: 0,
                  ),
                  cardTheme: const CardThemeData(
                    color: darkCardBg,
                    elevation: 3,
                    shape: RoundedRectangleBorder(
                      borderRadius: BorderRadius.all(Radius.circular(14)),
                    ),
                  ),
                  elevatedButtonTheme: ElevatedButtonThemeData(
                    style: ElevatedButton.styleFrom(
                      backgroundColor: emeraldGreen,
                      foregroundColor: Colors.white,
                      minimumSize: const Size(120, 52),
                      shape: RoundedRectangleBorder(
                        borderRadius: BorderRadius.circular(12),
                      ),
                    ),
                  ),
                ),
                theme: ThemeData(
                  brightness: Brightness.light,
                  scaffoldBackgroundColor: const Color(0xFFF3F4F6),
                  primaryColor: emeraldGreen,
                  colorScheme: const ColorScheme.light(
                    primary: emeraldGreen,
                    secondary: goldAccent,
                    surface: Colors.white,
                    error: alertRed,
                  ),
                ),
                home: MainShellScreen(
                  onToggleTheme: _toggleTheme,
                  isDark: _themeMode == ThemeMode.dark,
                ),
              );
            }
          }

          class MainShellScreen extends ConsumerStatefulWidget {
            final VoidCallback onToggleTheme;
            final bool isDark;

            const MainShellScreen({
              super.key,
              required this.onToggleTheme,
              required this.isDark,
            });

            @override
            ConsumerState<MainShellScreen> createState() => _MainShellScreenState();
          }

          class _MainShellScreenState extends ConsumerState<MainShellScreen> {
            int _selectedIndex = 0;
            bool _isBusy = false;
            static const _uuid = Uuid();

            Future<void> _seedSamplePartAndStock() async {
              if (_isBusy) return;
              setState(() => _isBusy = true);
              try {
                final db = ref.read(appDatabaseProvider);
                final dao = ref.read(posDaoProvider);

                await db.into(db.categories).insertOnConflictUpdate(
                      CategoriesCompanion.insert(
                        id: 'cat-engine',
                        name: 'أجزاء المحرك والفرامل',
                      ),
                    );

                await db.into(db.motorcycles).insertOnConflictUpdate(
                      MotorcyclesCompanion.insert(
                        id: 'moto-boxer-150',
                        make: 'باجاج (Bajaj)',
                        model: 'بوكسر 150 (Boxer BM150)',
                        yearFrom: const Value(2015),
                        yearTo: const Value(2026),
                      ),
                    );

                final existing = await (db.select(db.products)
                      ..where((p) => p.id.equals('prod-boxer-pad')))
                    .getSingleOrNull();

                if (existing == null) {
                  await db.into(db.products).insert(
                        ProductsCompanion.insert(
                          id: 'prod-boxer-pad',
                          internalCode: 'BRK-BX-01',
                          barcode: const Value('6221112223334'),
                          name: 'تيل فرامل خلفي بوكسر 150 أصلي',
                          categoryId: 'cat-engine',
                          oemNumber: const Value('DJ151033'),
                          unitId: 'unit-set',
                          purchasePriceMinor: const Value(10000),
                          weightedAverageCostMinor: const Value(10000),
                          retailPriceMinor: const Value(15000),
                          wholesalePriceMinor: const Value(13500),
                          storageLocation: const Value('ممر A - رف 2'),
                        ),
                      );

                  await db.into(db.productMotorcycles).insertOnConflictUpdate(
                        ProductMotorcyclesCompanion.insert(
                          id: 'pm-boxer-pad',
                          productId: 'prod-boxer-pad',
                          motorcycleId: 'moto-boxer-150',
                        ),
                      );
                }

                await dao.recordStockMovementAtomically(
                  warehouseId: 'wh-main',
                  productId: 'prod-boxer-pad',
                  quantityChangeMilli: MoneyUtil.toMilliQty(10),
                  movementType: InventoryMovementType.openingStock,
                  unitCostMinor: 10000,
                  referenceType: 'OpeningStock',
                  referenceId: 'OPEN-${DateTime.now().millisecondsSinceEpoch}',
                  userId: 'user-admin-default',
                  reasonNotes: 'إضافة رصيد مخزني من الهاتف',
                );

                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      backgroundColor: Color(0xFF10B981),
                      content: Text('تم تسجيل القطعة وإضافة 10 أطقم للمخزن بنجاح'),
                    ),
                  );
                  setState(() {});
                }
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(
                      backgroundColor: const Color(0xFFEF4444),
                      content: Text('خطأ: $e'),
                    ),
                  );
                }
              } finally {
                if (mounted) setState(() => _isBusy = false);
              }
            }

            Future<void> _executeQuickSale() async {
              if (_isBusy) return;
              setState(() => _isBusy = true);
              try {
                final dao = ref.read(posDaoProvider);
                final timestamp = DateTime.now().millisecondsSinceEpoch;

                await dao.createSalesInvoiceAtomically(
                  invoiceNumber: 'INV-$timestamp',
                  idempotencyKey: _uuid.v4(),
                  warehouseId: 'wh-main',
                  userId: 'user-admin-default',
                  paymentType: 'cash',
                  items: [
                    SaleItemInput(
                      productId: 'prod-boxer-pad',
                      unitId: 'unit-set',
                      quantityMilli: MoneyUtil.toMilliQty(1),
                      unitPriceMinor: 15000,
                    ),
                  ],
                  payments: const [
                    PaymentAllocationInput(
                      accountId: 'acc-main-cash',
                      amountMinor: 15000,
                    ),
                  ],
                );

                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      backgroundColor: Color(0xFF10B981),
                      content: Text(
                        'تم اعتماد الفاتورة (150 ج.م) وخصم المخزون وتحديث الخزنة بنجاح!',
                      ),
                    ),
                  );
                  setState(() {});
                }
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    SnackBar(
                      backgroundColor: const Color(0xFFEF4444),
                      content: Text('$e'),
                    ),
                  );
                }
              } finally {
                if (mounted) setState(() => _isBusy = false);
              }
            }

            Future<Map<String, dynamic>> _loadLiveDashboardMetrics() async {
              final db = ref.read(appDatabaseProvider);

              final invoices = await (db.select(db.salesInvoices)
                    ..where((i) => i.status.equals(SalesInvoiceStatus.completed.name)))
                  .get();
              final stocks = await db.select(db.warehouseStocks).get();
              final products = await db.select(db.products).get();
              final cashDrawer = await (db.select(db.financialAccounts)
                    ..where((a) => a.id.equals('acc-main-cash')))
                  .getSingleOrNull();
              final pendingSync = await (db.select(db.syncOutbox)
                    ..where((s) => s.syncStatus.equals(SyncStatus.localOnly.name)))
                  .get();

              int totalSalesMinor = 0;
              int totalCostMinor = 0;
              for (final inv in invoices) {
                totalSalesMinor += inv.netTotalMinor;
                totalCostMinor += inv.totalCostMinor;
              }

              int inventoryValueMinor = 0;
              int totalPiecesMilli = 0;
              for (final st in stocks) {
                totalPiecesMilli += st.quantityMilli;
                final prod = products.where((p) => p.id == st.productId).firstOrNull;
                if (prod != null) {
                  inventoryValueMinor +=
                      ((st.quantityMilli * prod.weightedAverageCostMinor) / 1000).round();
                }
              }

              return {
                'salesMinor': totalSalesMinor,
                'profitMinor': totalSalesMinor - totalCostMinor,
                'invoiceCount': invoices.length,
                'cashBalanceMinor': cashDrawer?.balanceMinor ?? 0,
                'inventoryValueMinor': inventoryValueMinor,
                'totalStockUnits': MoneyUtil.fromMilliQty(totalPiecesMilli),
                'pendingSyncCount': pendingSync.length,
              };
            }

            @override
            Widget build(BuildContext context) {
              final isTablet = MediaQuery.of(context).size.width >= 700;

              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  appBar: AppBar(
                    title: const Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(
                          'الدولي لقطع غيار الموتسيكلات',
                          style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold),
                        ),
                        Text(
                          'AL DAWLY POS — متصل محلياً (SQLite جاهز)',
                          style: TextStyle(fontSize: 12, color: Color(0xFF10B981)),
                        ),
                      ],
                    ),
                    actions: [
                      IconButton(
                        onPressed: widget.onToggleTheme,
                        icon: Icon(widget.isDark ? Icons.light_mode : Icons.dark_mode),
                      ),
                      IconButton(
                        onPressed: () => setState(() {}),
                        icon: const Icon(Icons.refresh),
                      ),
                    ],
                  ),
                  body: FutureBuilder<Map<String, dynamic>>(
                    future: _loadLiveDashboardMetrics(),
                    builder: (context, snapshot) {
                      if (!snapshot.hasData) {
                        return const Center(child: CircularProgressIndicator());
                      }
                      final data = snapshot.data!;

                      return SingleChildScrollView(
                        padding: const EdgeInsets.all(16),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.stretch,
                          children: [
                            Container(
                              padding: const EdgeInsets.symmetric(
                                horizontal: 16,
                                vertical: 12,
                              ),
                              decoration: BoxDecoration(
                                color: const Color(0xFF10B981).withOpacity(0.15),
                                borderRadius: BorderRadius.circular(12),
                                border: Border.all(color: const Color(0xFF10B981)),
                              ),
                              child: Text(
                                'النظام يعمل محلياً دون إنترنت — العمليات المعلقة للمزامنة: ${data['pendingSyncCount']}',
                                style: const TextStyle(fontWeight: FontWeight.bold),
                              ),
                            ),
                            const SizedBox(height: 16),
                            GridView.count(
                              crossAxisCount: isTablet ? 3 : 2,
                              shrinkWrap: true,
                              physics: const NeverScrollableScrollPhysics(),
                              mainAxisSpacing: 12,
                              crossAxisSpacing: 12,
                              childAspectRatio: 1.45,
                              children: [
                                _MetricCard(
                                  title: 'مبيعات اليوم',
                                  value: MoneyUtil.formatMinor(data['salesMinor']),
                                  icon: Icons.trending_up,
                                  accentColor: const Color(0xFF10B981),
                                ),
                                _MetricCard(
                                  title: 'مجمل الربح الفعلي',
                                  value: MoneyUtil.formatMinor(data['profitMinor']),
                                  icon: Icons.monetization_on,
                                  accentColor: const Color(0xFFF59E0B),
                                ),
                                _MetricCard(
                                  title: 'رصيد الخزنة النقدية',
                                  value: MoneyUtil.formatMinor(data['cashBalanceMinor']),
                                  icon: Icons.account_balance_wallet,
                                  accentColor: const Color(0xFF10B981),
                                ),
                                _MetricCard(
                                  title: 'قيمة المخزون بالتكلفة',
                                  value: MoneyUtil.formatMinor(data['inventoryValueMinor']),
                                  icon: Icons.warehouse,
                                  accentColor: const Color(0xFFF59E0B),
                                ),
                                _MetricCard(
                                  title: 'عدد الفواتير المعتمدة',
                                  value: '${data['invoiceCount']} فاتورة',
                                  icon: Icons.receipt_long,
                                  accentColor: Colors.blueAccent,
                                ),
                                _MetricCard(
                                  title: 'إجمالي القطع بالمخزن',
                                  value: '${data['totalStockUnits']} قطعة/طقم',
                                  icon: Icons.motorcycle,
                                  accentColor: Colors.purpleAccent,
                                ),
                              ],
                            ),
                            const SizedBox(height: 24),
                            ElevatedButton.icon(
                              onPressed: _isBusy ? null : _seedSamplePartAndStock,
                              icon: const Icon(Icons.add_box),
                              style: ElevatedButton.styleFrom(
                                backgroundColor: const Color(0xFFF59E0B),
                                foregroundColor: Colors.black,
                              ),
                              label: const Text(
                                '1. إضافة (تيل فرامل بوكسر أصلي) + 10 أطقم للمخزن',
                              ),
                            ),
                            const SizedBox(height: 12),
                            ElevatedButton.icon(
                              onPressed: _isBusy ? null : _executeQuickSale,
                              icon: const Icon(Icons.point_of_sale),
                              label: const Text(
                                '2. إصدار فاتورة بيع نقدية (150 ج.م) وخصم المخزون',
                              ),
                            ),
                          ],
                        ),
                      );
                    },
                  ),
                  bottomNavigationBar: BottomNavigationBar(
                    currentIndex: _selectedIndex,
                    onTap: (idx) => setState(() => _selectedIndex = idx),
                    selectedItemColor: const Color(0xFF10B981),
                    items: const [
                      BottomNavigationBarItem(
                        icon: Icon(Icons.dashboard),
                        label: 'الرئيسية',
                      ),
                      BottomNavigationBarItem(
                        icon: Icon(Icons.point_of_sale),
                        label: 'الكاشير',
                      ),
                      BottomNavigationBarItem(
                        icon: Icon(Icons.inventory_2),
                        label: 'المخزن',
                      ),
                    ],
                  ),
                ),
              );
            }
          }

          class _MetricCard extends StatelessWidget {
            final String title;
            final String value;
            final IconData icon;
            final Color accentColor;

            const _MetricCard({
              required this.title,
              required this.value,
              required this.icon,
              required this.accentColor,
            });

            @override
            Widget build(BuildContext context) {
              return Card(
                child: Padding(
                  padding: const EdgeInsets.all(14),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                    children: [
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Expanded(
                            child: Text(
                              title,
                              style: const TextStyle(
                                fontSize: 13,
                                fontWeight: FontWeight.w600,
                              ),
                              overflow: TextOverflow.ellipsis,
                            ),
                          ),
                          Icon(icon, color: accentColor, size: 22),
                        ],
                      ),
                      Text(
                        value,
                        style: TextStyle(
                          fontSize: 17,
                          fontWeight: FontWeight.bold,
                          color: accentColor,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

      - name: 6. Install Dependencies
        run: flutter pub get

      - name: 7. Generate Drift SQLite Database Code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 8. Build Release APK
        run: flutter build apk --release

      - name: 9. Upload APK Ready for Phone
        uses: actions/upload-artifact@v4
        with:
          name: AL-DAWLY-POS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
