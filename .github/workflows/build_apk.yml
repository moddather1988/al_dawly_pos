          import 'dart:convert';
          import 'package:drift/drift.dart';
          import 'package:uuid/uuid.dart';
          import '../../core/constants/app_enums.dart';
          import '../../core/utils/money_formatter.dart';
          import '../app_database.dart';
          import '../tables/core_tables.dart';
          import '../tables/catalog_tables.dart';
          import '../tables/inventory_tables.dart';
          import '../tables/party_tables.dart';
          import '../tables/invoice_tables.dart';
          import '../tables/finance_tables.dart';
          import '../tables/sync_tables.dart';

          part 'pos_transaction_dao.g.dart';

          class SaleItemInput {
            final String productId;
            final String unitId;
            final int quantityMilli;
            final int unitPriceMinor;
            final int itemDiscountMinor;
            final int taxRateBasisPoints;

            const SaleItemInput({
              required this.productId,
              required this.unitId,
              required this.quantityMilli,
              required this.unitPriceMinor,
              this.itemDiscountMinor = 0,
              this.taxRateBasisPoints = 0,
            });
          }

          class PaymentAllocationInput {
            final String accountId;
            final int amountMinor;

            const PaymentAllocationInput({
              required this.accountId,
              required this.amountMinor,
            });
          }

          @DriftAccessor(tables: [
            Users,
            AuditLogs,
            Products,
            Motorcycles,
            ProductMotorcycles,
            Warehouses,
            WarehouseStocks,
            InventoryMovements,
            Customers,
            Suppliers,
            SalesInvoices,
            SalesInvoiceItems,
            PurchaseInvoices,
            PurchaseInvoiceItems,
            InvoiceReturns,
            InvoiceReturnItems,
            FinancialAccounts,
            Shifts,
            FinancialTransactions,
            SyncOutbox,
          ])
          class PosTransactionDao extends DatabaseAccessor<AppDatabase>
              with _$PosTransactionDaoMixin {
            PosTransactionDao(super.db);

            static const _uuid = Uuid();

            Future<List<Product>> searchParts({
              String? searchQuery,
              String? motorcycleId,
              bool activeOnly = true,
            }) async {
              final query = select(products).join([
                if (motorcycleId != null)
                  innerJoin(
                    productMotorcycles,
                    productMotorcycles.productId.equalsExp(products.id) &
                        productMotorcycles.motorcycleId.equals(motorcycleId),
                  ),
              ]);

              if (activeOnly) {
                query.where(products.status.equals(ProductStatus.active.name));
              }

              if (searchQuery != null && searchQuery.trim().isNotEmpty) {
                final pattern = '%${searchQuery.trim()}%';
                query.where(
                  products.name.like(pattern) |
                      products.internalCode.like(pattern) |
                      products.barcode.like(pattern) |
                      products.oemNumber.like(pattern) |
                      products.alternativeNumbers.like(pattern),
                );
              }

              final rows = await query.get();
              return rows.map((r) => r.readTable(products)).toList();
            }

            Future<void> recordStockMovementAtomically({
              required String warehouseId,
              required String productId,
              required int quantityChangeMilli,
              required InventoryMovementType movementType,
              required int unitCostMinor,
              required String referenceType,
              required String referenceId,
              required String userId,
              String? reasonNotes,
            }) async {
              await transaction(() async {
                final existingStock = await (select(warehouseStocks)
                      ..where((t) =>
                          t.warehouseId.equals(warehouseId) &
                          t.productId.equals(productId)))
                    .getSingleOrNull();

                final currentQtyMilli = existingStock?.quantityMilli ?? 0;
                final newQtyMilli = currentQtyMilli + quantityChangeMilli;

                if (newQtyMilli < 0) {
                  throw StateError(
                    'رصيد المخزون غير كافٍ لإتمام الحركة. المتاح: ${MoneyUtil.fromMilliQty(currentQtyMilli)}',
                  );
                }

                if (existingStock == null) {
                  await into(warehouseStocks).insert(
                    WarehouseStocksCompanion.insert(
                      id: _uuid.v4(),
                      warehouseId: warehouseId,
                      productId: productId,
                      quantityMilli: Value(newQtyMilli),
                    ),
                  );
                } else {
                  await (update(warehouseStocks)
                        ..where((t) => t.id.equals(existingStock.id)))
                      .write(
                    WarehouseStocksCompanion(
                      quantityMilli: Value(newQtyMilli),
                      updatedAt: Value(DateTime.now()),
                    ),
                  );
                }

                if (quantityChangeMilli > 0 &&
                    (movementType == InventoryMovementType.openingStock ||
                        movementType == InventoryMovementType.purchaseReceive)) {
                  final product = await (select(products)
                        ..where((p) => p.id.equals(productId)))
                      .getSingle();

                  final newWac = MoneyUtil.calculateWeightedAverageCost(
                    currentQtyMilli: currentQtyMilli,
                    currentWacMinor: product.weightedAverageCostMinor,
                    incomingQtyMilli: quantityChangeMilli,
                    incomingUnitCostMinor: unitCostMinor,
                  );

                  await (update(products)..where((p) => p.id.equals(productId))).write(
                    ProductsCompanion(
                      purchasePriceMinor: Value(unitCostMinor),
                      weightedAverageCostMinor: Value(newWac),
                      updatedAt: Value(DateTime.now()),
                    ),
                  );
                }

                await into(inventoryMovements).insert(
                  InventoryMovementsCompanion.insert(
                    id: _uuid.v4(),
                    productId: productId,
                    warehouseId: warehouseId,
                    movementType: movementType.name,
                    quantityChangeMilli: quantityChangeMilli,
                    quantityBeforeMilli: currentQtyMilli,
                    quantityAfterMilli: newQtyMilli,
                    unitCostMinor: unitCostMinor,
                    referenceType: referenceType,
                    referenceId: referenceId,
                    reasonNotes: Value(reasonNotes),
                    createdByUserId: userId,
                  ),
                );
              });
            }

            Future<String> createSalesInvoiceAtomically({
              required String invoiceNumber,
              required String idempotencyKey,
              required String warehouseId,
              required String userId,
              required List<SaleItemInput> items,
              required List<PaymentAllocationInput> payments,
              String? customerId,
              String? shiftId,
              int invoiceDiscountMinor = 0,
              bool isParked = false,
              String paymentType = 'cash',
              DateTime? dueDate,
              String? notes,
            }) async {
              return await transaction(() async {
                final existingInvoice = await (select(salesInvoices)
                      ..where((tbl) => tbl.idempotencyKey.equals(idempotencyKey)))
                    .getSingleOrNull();
                if (existingInvoice != null) return existingInvoice.id;

                if (items.isEmpty) {
                  throw ArgumentError('لا يمكن حفظ فاتورة مبيعات فارغة.');
                }

                final invoiceId = _uuid.v4();
                int subtotalMinor = 0;
                int taxTotalMinor = 0;
                int totalCostMinor = 0;

                final List<SalesInvoiceItemsCompanion> itemCompanions = [];

                for (final item in items) {
                  final product = await (select(products)
                        ..where((p) => p.id.equals(item.productId)))
                      .getSingle();

                  final lineSub = MoneyUtil.calculateLineSubtotal(
                    unitPriceMinor: item.unitPriceMinor,
                    qtyMilli: item.quantityMilli,
                    discountMinor: item.itemDiscountMinor,
                  );
                  final lineTax = MoneyUtil.calculateTax(
                    amountMinor: lineSub,
                    taxRateBasisPoints: item.taxRateBasisPoints,
                  );
                  final lineTotal = lineSub + lineTax;
                  final itemCostTotal =
                      ((product.weightedAverageCostMinor * item.quantityMilli) / 1000)
                          .round();

                  subtotalMinor += lineSub;
                  taxTotalMinor += lineTax;
                  totalCostMinor += itemCostTotal;

                  itemCompanions.add(
                    SalesInvoiceItemsCompanion.insert(
                      id: _uuid.v4(),
                      invoiceId: invoiceId,
                      productId: item.productId,
                      unitId: item.unitId,
                      quantityMilli: item.quantityMilli,
                      unitPriceMinor: item.unitPriceMinor,
                      unitCostSnapshotMinor: product.weightedAverageCostMinor,
                      itemDiscountMinor: Value(item.itemDiscountMinor),
                      taxMinor: Value(lineTax),
                      lineTotalMinor: lineTotal,
                    ),
                  );
                }

                final netTotalMinor =
                    (subtotalMinor - invoiceDiscountMinor) + taxTotalMinor;
                final paidAmountMinor =
                    payments.fold<int>(0, (sum, p) => sum + p.amountMinor);
                final remainingDebtMinor =
                    isParked ? netTotalMinor : (netTotalMinor - paidAmountMinor);

                final status =
                    isParked ? SalesInvoiceStatus.parked : SalesInvoiceStatus.completed;

                await into(salesInvoices).insert(
                  SalesInvoicesCompanion.insert(
                    id: invoiceId,
                    invoiceNumber: invoiceNumber,
                    idempotencyKey: idempotencyKey,
                    customerId: Value(customerId),
                    warehouseId: warehouseId,
                    shiftId: Value(shiftId),
                    status: status.name,
                    paymentType: paymentType,
                    subtotalMinor: subtotalMinor,
                    discountMinor: Value(invoiceDiscountMinor),
                    taxTotalMinor: Value(taxTotalMinor),
                    netTotalMinor: netTotalMinor,
                    paidAmountMinor: Value(isParked ? 0 : paidAmountMinor),
                    remainingDebtMinor: Value(remainingDebtMinor),
                    totalCostMinor: Value(totalCostMinor),
                    dueDate: Value(dueDate),
                    notes: Value(notes),
                    createdByUserId: userId,
                  ),
                );

                for (final itemComp in itemCompanions) {
                  await into(salesInvoiceItems).insert(itemComp);
                }

                if (isParked) return invoiceId;

                for (final item in items) {
                  final product = await (select(products)
                        ..where((p) => p.id.equals(item.productId)))
                      .getSingle();

                  await recordStockMovementAtomically(
                    warehouseId: warehouseId,
                    productId: item.productId,
                    quantityChangeMilli: -item.quantityMilli,
                    movementType: InventoryMovementType.saleIssue,
                    unitCostMinor: product.weightedAverageCostMinor,
                    referenceType: 'SalesInvoice',
                    referenceId: invoiceId,
                    userId: userId,
                    reasonNotes: 'صرف فاتورة مبيعات رقم $invoiceNumber',
                  );
                }

                int paymentIndex = 1;
                for (final payment in payments) {
                  if (payment.amountMinor <= 0) continue;

                  final account = await (select(financialAccounts)
                        ..where((a) => a.id.equals(payment.accountId)))
                      .getSingle();

                  final beforeBalance = account.balanceMinor;
                  final afterBalance = beforeBalance + payment.amountMinor;

                  await (update(financialAccounts)
                        ..where((a) => a.id.equals(payment.accountId)))
                      .write(
                    FinancialAccountsCompanion(
                      balanceMinor: Value(afterBalance),
                      updatedAt: Value(DateTime.now()),
                    ),
                  );

                  await into(financialTransactions).insert(
                    FinancialTransactionsCompanion.insert(
                      id: _uuid.v4(),
                      voucherNumber: 'RV-$invoiceNumber-$paymentIndex',
                      idempotencyKey: '$idempotencyKey-PAY-$paymentIndex',
                      accountId: payment.accountId,
                      shiftId: Value(shiftId),
                      transactionType: FinancialTransactionType.salePayment.name,
                      direction: 1,
                      amountMinor: payment.amountMinor,
                      balanceBeforeMinor: beforeBalance,
                      balanceAfterMinor: afterBalance,
                      customerId: Value(customerId),
                      referenceType: const Value('SalesInvoice'),
                      referenceId: Value(invoiceId),
                      notes: Value('تحصيل فاتورة مبيعات $invoiceNumber'),
                      createdByUserId: userId,
                    ),
                  );
                  paymentIndex++;
                }

                await into(syncOutbox).insert(
                  SyncOutboxCompanion.insert(
                    id: _uuid.v4(),
                    idempotencyKey: idempotencyKey,
                    entityType: 'SalesInvoice',
                    entityId: invoiceId,
                    operation: 'CREATE',
                    payloadJson: jsonEncode({
                      'invoiceId': invoiceId,
                      'invoiceNumber': invoiceNumber,
                      'netTotalMinor': netTotalMinor,
                    }),
                  ),
                );

                return invoiceId;
              });
            }
          }
          EOF

