name: Build AL DAWLY POS APK Phase 2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Create Clean Flutter App
        run: |
          flutter create temp_app --org com.aldawly.pos --platforms=android
          cp -r temp_app/android ./
          rm -rf temp_app

      - name: 5. Generate Phase 2 Project Files Automatically
        run: |
          mkdir -p lib/core/utils
          mkdir -p lib/core/theme
          mkdir -p lib/features/shell

          # 1. pubspec.yaml
          cat << 'EOF' > pubspec.yaml
          name: al_dawly_pos
          description: نظام الدولي لقطع غيار الموتسيكلات - AL DAWLY POS
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.4.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            flutter_riverpod: ^2.5.1
            drift: ^2.20.2
            sqlite3_flutter_libs: ^0.5.24
            path_provider: ^2.1.4
            path: ^1.9.0
            uuid: ^4.5.0
            crypto: ^3.0.5
            intl: ^0.20.3
            equatable: ^2.0.5
            dio: ^5.7.0
            connectivity_plus: ^6.0.5
            shared_preferences: ^2.3.2

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0
            drift_dev: ^2.20.3
            build_runner: ^2.4.12

          flutter:
            uses-material-design: true
          EOF

          # 2. lib/core/utils/money_formatter.dart
          cat << 'EOF' > lib/core/utils/money_formatter.dart
          import 'package:intl/intl.dart';

          class MoneyUtil {
            MoneyUtil._();

            static final NumberFormat _arabicCurrencyFormat = NumberFormat.currency(
              locale: 'ar_EG',
              symbol: 'ج.م',
              decimalDigits: 2,
            );

            static int toMinorUnits(num amountInMajor) => (amountInMajor * 100).round();
            static double toMajorUnits(int amountInMinor) => amountInMinor / 100.0;
            static String formatMinor(int amountInMinor) => _arabicCurrencyFormat.format(toMajorUnits(amountInMinor));
            static int toMilliQty(num quantity) => (quantity * 1000).round();
            static double fromMilliQty(int milliQty) => milliQty / 1000.0;
          }
          EOF

          # 3. lib/core/theme/app_theme.dart
          cat << 'EOF' > lib/core/theme/app_theme.dart
          import 'package:flutter/material.dart';

          class AppTheme {
            AppTheme._();

            static const Color darkNavyBg = Color(0xFF0B132B);
            static const Color darkCardBg = Color(0xFF1C2541);
            static const Color emeraldGreen = Color(0xFF10B981);
            static const Color goldAccent = Color(0xFFF59E0B);
            static const Color alertRed = Color(0xFFEF4444);

            static ThemeData get darkTheme {
              return ThemeData(
                brightness: Brightness.dark,
                scaffoldBackgroundColor: darkNavyBg,
                primaryColor: emeraldGreen,
                colorScheme: const ColorScheme.dark(
                  primary: emeraldGreen,
                  secondary: goldAccent,
                  surface: darkCardBg,
                  error: alertRed,
                ),
                appBarTheme: const AppBarTheme(
                  backgroundColor: darkCardBg,
                  foregroundColor: Colors.white,
                  elevation: 0,
                  centerTitle: false,
                ),
                cardTheme: const CardThemeData(
                  color: darkCardBg,
                  elevation: 3,
                  shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.all(Radius.circular(14)),
                  ),
                ),
                elevatedButtonTheme: ElevatedButtonThemeData(
                  style: ElevatedButton.styleFrom(
                    backgroundColor: emeraldGreen,
                    foregroundColor: Colors.white,
                    minimumSize: const Size(120, 52),
                    textStyle: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                    shape: RoundedRectangleBorder(
                      borderRadius: BorderRadius.circular(12),
                    ),
                  ),
                ),
              );
            }

            static ThemeData get lightTheme {
              return ThemeData(
                brightness: Brightness.light,
                scaffoldBackgroundColor: const Color(0xFFF3F4F6),
                primaryColor: emeraldGreen,
                colorScheme: const ColorScheme.light(
                  primary: emeraldGreen,
                  secondary: goldAccent,
                  surface: Colors.white,
                  error: alertRed,
                ),
                appBarTheme: const AppBarTheme(
                  backgroundColor: Colors.white,
                  foregroundColor: Color(0xFF0B132B),
                  elevation: 0,
                ),
                cardTheme: const CardThemeData(
                  color: Colors.white,
                  elevation: 2,
                  shape: RoundedRectangleBorder(
                    borderRadius: BorderRadius.all(Radius.circular(14)),
                  ),
                ),
              );
            }
          }
          EOF

          # 4. lib/features/shell/main_shell_screen.dart
          cat << 'EOF' > lib/features/shell/main_shell_screen.dart
          import 'package:flutter/material.dart';
          import '../../core/utils/money_formatter.dart';

          class MainShellScreen extends StatefulWidget {
            final VoidCallback onToggleTheme;
            final bool isDark;

            const MainShellScreen({
              super.key,
              required this.onToggleTheme,
              required this.isDark,
            });

            @override
            State<MainShellScreen> createState() => _MainShellScreenState();
          }

          class _MainShellScreenState extends State<MainShellScreen> {
            int _selectedIndex = 0;

            @override
            Widget build(BuildContext context) {
              final bool isTablet = MediaQuery.of(context).size.width >= 700;

              final List<Widget> screens = [
                const DashboardPlaceholderTab(),
                const PosPlaceholderTab(),
                const InventoryPlaceholderTab(),
                const SettingsPlaceholderTab(),
              ];

              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  appBar: AppBar(
                    title: const Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(
                          'الدولي لقطع غيار الموتسيكلات',
                          style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold),
                        ),
                        Text(
                          'AL DAWLY POS — المرحلة الثانية (واجهة RTL والتجاوب الذكي)',
                          style: TextStyle(fontSize: 11, color: Color(0xFF10B981)),
                        ),
                      ],
                    ),
                    actions: [
                      IconButton(
                        tooltip: 'تبديل المظهر',
                        onPressed: widget.onToggleTheme,
                        icon: Icon(widget.isDark ? Icons.light_mode : Icons.dark_mode),
                      ),
                    ],
                  ),
                  body: Row(
                    children: [
                      if (isTablet)
                        NavigationRail(
                          selectedIndex: _selectedIndex,
                          onDestinationSelected: (idx) => setState(() => _selectedIndex = idx),
                          labelType: NavigationRailLabelType.all,
                          selectedItemColor: const Color(0xFF10B981),
                          destinations: const [
                            NavigationRailDestination(
                              icon: Icon(Icons.dashboard_outlined),
                              selectedIcon: Icon(Icons.dashboard),
                              label: Text('الرئيسية'),
                            ),
                            NavigationRailDestination(
                              icon: Icon(Icons.point_of_sale_outlined),
                              selectedIcon: Icon(Icons.point_of_sale),
                              label: Text('الكاشير'),
                            ),
                            NavigationRailDestination(
                              icon: Icon(Icons.inventory_2_outlined),
                              selectedIcon: Icon(Icons.inventory_2),
                              label: Text('المخزن'),
                            ),
                            NavigationRailDestination(
                              icon: Icon(Icons.settings_outlined),
                              selectedIcon: Icon(Icons.settings),
                              label: Text('الإعدادات'),
                            ),
                          ],
                        ),
                      Expanded(
                        child: screens[_selectedIndex],
                      ),
                    ],
                  ),
                  bottomNavigationBar: isTablet
                      ? null
                      : BottomNavigationBar(
                          currentIndex: _selectedIndex,
                          onTap: (idx) => setState(() => _selectedIndex = idx),
                          selectedItemColor: const Color(0xFF10B981),
                          unselectedItemColor: Colors.grey,
                          type: BottomNavigationBarType.fixed,
                          items: const [
                            BottomNavigationBarItem(
                              icon: Icon(Icons.dashboard),
                              label: 'الرئيسية',
                            ),
                            BottomNavigationBarItem(
                              icon: Icon(Icons.point_of_sale),
                              label: 'الكاشير',
                            ),
                            BottomNavigationBarItem(
                              icon: Icon(Icons.inventory_2),
                              label: 'المخزن',
                            ),
                            BottomNavigationBarItem(
                              icon: Icon(Icons.settings),
                              label: 'الإعدادات',
                            ),
                          ],
                        ),
                ),
              );
            }
          }

          class DashboardPlaceholderTab extends StatelessWidget {
            const DashboardPlaceholderTab({super.key});

            @override
            Widget build(BuildContext context) {
              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  Container(
                    padding: const EdgeInsets.all(16),
                    decoration: BoxDecoration(
                      color: const Color(0xFF10B981).withOpacity(0.15),
                      borderRadius: BorderRadius.circular(12),
                      border: Border.all(color: const Color(0xFF10B981)),
                    ),
                    child: const Row(
                      children: [
                        Icon(Icons.check_circle, color: Color(0xFF10B981)),
                        SizedBox(width: 12),
                        Expanded(
                          child: Text(
                            'تم إنجاز المرحلة الثانية بنجاح: واجهة عربية صحيحة RTL بالكامل، دعم التابلت والموبايل بذكاء.',
                            style: TextStyle(fontWeight: FontWeight.bold),
                          ),
                        ),
                      ],
                    ),
                  ),
                  const SizedBox(height: 16),
                  GridView.count(
                    crossAxisCount: MediaQuery.of(context).size.width >= 700 ? 3 : 2,
                    shrinkWrap: true,
                    physics: const NeverScrollableScrollPhysics(),
                    mainAxisSpacing: 12,
                    crossAxisSpacing: 12,
                    childAspectRatio: 1.45,
                    children: [
                      _MetricCard(title: 'مبيعات اليوم', value: MoneyUtil.formatMinor(154000), icon: Icons.trending_up, accentColor: const Color(0xFF10B981)),
                      _MetricCard(title: 'مجمل الأرباح', value: MoneyUtil.formatMinor(42000), icon: Icons.monetization_on, accentColor: const Color(0xFFF59E0B)),
                      _MetricCard(title: 'رصيد الخزنة', value: MoneyUtil.formatMinor(310000), icon: Icons.account_balance_wallet, accentColor: const Color(0xFF10B981)),
                      _MetricCard(title: 'قيمة المخزون', value: MoneyUtil.formatMinor(1250000), icon: Icons.warehouse, accentColor: const Color(0xFFF59E0B)),
                    ],
                  ),
                ],
              );
            }
          }

          class PosPlaceholderTab extends StatelessWidget {
            const PosPlaceholderTab({super.key});
            @override
            Widget build(BuildContext context) => const Center(child: Text('شاشة الكاشير السريع (المرحلة الرابعة)', style: TextStyle(fontSize: 18)));
          }

          class InventoryPlaceholderTab extends StatelessWidget {
            const InventoryPlaceholderTab({super.key});
            @override
            Widget build(BuildContext context) => const Center(child: Text('إدارة المخزون وقطع الغيار (المرحلة الثالثة)', style: TextStyle(fontSize: 18)));
          }

          class SettingsPlaceholderTab extends StatelessWidget {
            const SettingsPlaceholderTab({super.key});
            @override
            Widget build(BuildContext context) => const Center(child: Text('إعدادات النشاط والبيانات والنسخ الاحتياطي', style: TextStyle(fontSize: 18)));
          }

          class _MetricCard extends StatelessWidget {
            final String title;
            final String value;
            final IconData icon;
            final Color accentColor;

            const _MetricCard({required this.title, required this.value, required this.icon, required this.accentColor});

            @override
            Widget build(BuildContext context) {
              return Card(
                child: Padding(
                  padding: const EdgeInsets.all(14),
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                    children: [
                      Row(
                        mainAxisAlignment: MainAxisAlignment.spaceBetween,
                        children: [
                          Text(title, style: const TextStyle(fontSize: 13, fontWeight: FontWeight.w600)),
                          Icon(icon, color: accentColor, size: 22),
                        ],
                      ),
                      Text(value, style: TextStyle(fontSize: 17, fontWeight: FontWeight.bold, color: accentColor)),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          # 5. lib/main.dart
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';
          import 'package:flutter_localizations/flutter_localizations.dart';
          import 'core/theme/app_theme.dart';
          import 'features/shell/main_shell_screen.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const AlDawlyPosApp());
          }

          class AlDawlyPosApp extends StatefulWidget {
            const AlDawlyPosApp({super.key});

            @override
            State<AlDawlyPosApp> createState() => _AlDawlyPosAppState();
          }

          class _AlDawlyPosAppState extends State<AlDawlyPosApp> {
            ThemeMode _themeMode = ThemeMode.dark;

            void _toggleTheme() {
              setState(() {
                _themeMode = _themeMode == ThemeMode.dark ? ThemeMode.light : ThemeMode.dark;
              });
            }

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'الدولي لقطع غيار الموتسيكلات - AL DAWLY POS',
                debugShowCheckedModeBanner: false,
                locale: const Locale('ar', 'EG'),
                supportedLocales: const [Locale('ar', 'EG')],
                localizationsDelegates: const [
                  GlobalMaterialLocalizations.delegate,
                  GlobalWidgetsLocalizations.delegate,
                  GlobalCupertinoLocalizations.delegate,
                ],
                themeMode: _themeMode,
                theme: AppTheme.lightTheme,
                darkTheme: AppTheme.darkTheme,
                home: MainShellScreen(
                  onToggleTheme: _toggleTheme,
                  isDark: _themeMode == ThemeMode.dark,
                ),
              );
            }
          }
          EOF

      - name: 6. Install Dependencies
        run: flutter pub get

      - name: 7. Build Release APK
        run: flutter build apk --release

      - name: 8. Upload APK Ready for Phone
        uses: actions/upload-artifact@v4
        with:
          name: AL-DAWLY-POS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
extDueDate => dateTime().nullable()();
            TextColumn get notes => text().nullable()();
            BoolColumn get isActive => boolean().withDefault(const Constant(true))();
            DateTimeColumn get createdAt => dateTime().withDefault(currentDateAndTime)();
            DateTimeColumn get updatedAt => dateTime().withDefault(currentDateAndTime)();
            @override
            Set<Column> get primaryKey => {id};
          }
          EOF

          # 6. lib/database/tables/catalog_tables.dart
          cat << 'EOF' > lib/database/tables/catalog_tables.dart
          import 'package:drift/drift.dart';
          import 'party_tables.dart';

          class Categories extends Table {
            TextColumn get id => text()();
            TextColumn get name => text().unique()();
            TextColumn get parentId => text().nullable()();
            TextColumn get description => text().nullable()();
            BoolColumn get isActive => boolean().withDefault(const Constant(true))();
            DateTimeColumn get updatedAt => dateTime().withDefault(currentDateAndTime)();
            @override
            Set<Column> get primaryKey => {id};
          }

          class Brands extends Table {
            TextColumn get id => text()();
            TextColumn get name => text().unique()();
            TextColumn get manufacturerCountry => text().nullable()();
            BoolColumn get isActive => boolean().withDefault(const Constant(true))();
            DateTimeColumn get updatedAt => dateTime().withDefault(currentDateAndTime)();
            @override
            Set<Column> get primaryKey => {id};
          }

          class Units extends Table {
            TextColumn get id => text()();
            TextColumn get name => text().unique()();
            TextColumn get baseUnitId => text().nullable()();
            IntColumn get conversionFactorMilli => integer().withDefault(const Constant(1000))();
            DateTimeColumn get updatedAt => dateTime().withDefault(currentDateAndTime)();
            @override
            Set<Column> get primaryKey => {id};
          }

          class Motorcycles extends Table {
            TextColumn get id => text()();
            TextColumn get make => text()();
            TextColumn get model => text()();
            IntColumn get yearFrom => integer().nullable()();
            IntColumn get yearTo => integer().nullable()();
            TextColumn get engineCc => text().nullable()();
            TextColumn get notes => text().nullable()();
            BoolColumn get isActive => boolean().withDefault(const Constant(true))();
            DateTimeColumn get updatedAt => dateTime().withDefault(currentDateAndTime)();
            @override
            Set<Column> get primaryKey => {id};
          }

          class Products extends Table {
            TextColumn get id => text()();
            TextColumn get internalCode => text().unique()();
            TextColumn get barcode => text().nullable()();
            TextColumn get name => text()();
            TextColumn get categoryId => text().references(Categories, #id)();
            TextColumn get brandId => text().nullable().references(Brands, #id)();
            TextColumn get manufacturerName => text().nullable()();
            TextColumn get oemNumber => text().nullable()();
            TextColumn get alternativeNumbers => text().nullable()();
            TextColumn get compatibleYearsRange => text().nullable()();
            TextColumn get description => text().nullable()();
            TextColumn get imagePath => text().nullable()();
            TextColumn get defaultSupplierId => text().nullable().references(Suppliers, #id)();
            TextColumn get unitId => text().references(Units, #id)();
            IntColumn get purchasePriceMinor => integer().withDefault(const Constant(0))();
            IntColumn get weightedAverageCostMinor => integer().withDefault(const Constant(0))();
            IntColumn get retailPriceMinor => integer().withDefault(const Constant(0))();
            IntColumn get wholesalePriceMinor => integer().withDefault(const Constant(0))();
            IntColumn get taxRateBasisPoints => integer().withDefault(const Constant(0))();
            IntColumn get minStockLevelMilli => integer().withDefault(const Constant(2000))();
            TextColumn get storageLocation => text().nullable()();
            TextColumn get status => text().withDefault(const Constant('active'))();
            DateTimeColumn get lastSoldAt => dateTime().nullable()();
            DateTimeColumn get createdAt => dateTime().withDefault(currentDateAndTime)();
            DateTimeColumn get updatedAt => dateTime().withDefault(currentDateAndTime)();
            @override
            Set<Column> get primaryKey => {id};
          }

          class ProductMotorcycles extends Table {
            TextColumn get id => text()();
            TextColumn get productId => text().references(Products, #id, onDelete: KeyAction.cascade)();
            TextColumn get motorcycleId => text().references(Motorcycles, #id, onDelete: KeyAction.cascade)();
            TextColumn get fitmentNotes => text().nullable()();
            DateTimeColumn get createdAt => dateTime().withDefault(currentDateAndTime)();
            @override
            Set<Column> get primaryKey => {id};
            @override
            List<Set<Column>> get uniqueKeys => [{productId, motorcycleId}];
          }
          EOF

          # 7. lib/database/tables/inventory_tables.dart
          cat << 'EOF' > lib/database/tables/inventory_tables.dart
