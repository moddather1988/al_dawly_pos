            TextColumn get categoryId => text().references(ExpenseCategories, #id)();
            TextColumn get accountId => text().references(FinancialAccounts, #id)();
            TextColumn get financialTransactionId => text().references(FinancialTransactions, #id)();
            TextColumn get shiftId => text().nullable().references(Shifts, #id)();
            IntColumn get amountMinor => integer()();
            TextColumn get description => text()();
            TextColumn get receiptImagePath => text().nullable()();
            TextColumn get createdByUserId => text().references(Users, #id)();
            DateTimeColumn get expenseDate => dateTime().withDefault(currentDateAndTime)();
            @override
            Set<Column> get primaryKey => {id};
          }
          EOF

          # 9. lib/database/tables/invoice_tables.dart
          cat << 'EOF' > lib/database/tables/invoice_tables.dart
          import 'package:drift/drift.dart';
          import 'core_tables.dart';
          import 'catalog_tables.dart';
          import 'inventory_tables.dart';
          import 'party_tables.dart';
          import 'finance_tables.dart';

          class SalesInvoices extends Table {
            TextColumn get id => text()();
            TextColumn get invoiceNumber => text().unique()();
